<main class="container">

<h1>站内搜索</h1>
<p class="sub">在 1482 条资料中查找角色 / 技能 / 附加品 / 地图</p>

<input id="q" type="search" class="search-box" placeholder="输入关键词，支持中文效果描述（如 治疗、加速、钩子）" autocomplete="off">
<div id="filters" class="filters">
  <label><input type="radio" name="kind" value="all" checked> 全部</label>
  <label><input type="radio" name="kind" value="角色"> 角色</label>
  <label><input type="radio" name="kind" value="技能"> 技能</label>
  <label><input type="radio" name="kind" value="附加品"> 附加品</label>
  <label><input type="radio" name="kind" value="地图"> 地图</label>
</div>

<p id="count" class="count"></p>
<ul id="results" class="results"></ul>
<noscript><p class="hint">站内搜索需要启用 JavaScript。</p></noscript>

<script id="search-index-url" type="application/json">static/search-index.json</script>
<script>
(function () {
  var q = document.getElementById('q');
  var results = document.getElementById('results');
  var countEl = document.getElementById('count');
  var radios = document.querySelectorAll('#filters input');
  var limit = 60;
  var index = [];

  // index rows are compact arrays: [kind, id, name_zh, name_en, body, url]
  var K = 0, I = 1, NZ = 2, NE = 3, B = 4, U = 5;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function score(it, needle) {
    var s = 0;
    if (it[NZ] && it[NZ].indexOf(needle) === 0) s += 100;
    else if (it[NZ] && it[NZ].indexOf(needle) >= 0) s += 60;
    if (it[NE] && it[NE].toLowerCase().indexOf(needle) >= 0) s += 40;
    if (it[I] && it[I].toLowerCase().indexOf(needle) >= 0) s += 20;
    if (it[B] && it[B].indexOf(needle) >= 0) s += 10;
    return s;
  }

  function snippetFor(it, needle) {
    var body = it[B];
    if (!body) return '';
    var i = body.indexOf(needle);
    if (i < 0) return '';
    var start = Math.max(0, i - 20);
    return (start > 0 ? '…' : '') + body.slice(start, start + 70);
  }

  function render() {
    var needle = q.value.trim().toLowerCase();
    var kind = document.querySelector('#filters input:checked').value;
    if (!needle) {
      countEl.textContent = '';
      results.innerHTML = '<li class="hint">输入关键词开始搜索。</li>';
      return;
    }
    var hits = [];
    for (var i = 0; i < index.length; i++) {
      var it = index[i];
      if (kind !== 'all' && it[K] !== kind) continue;
      var s = score(it, needle);
      if (s > 0) hits.push([s, it]);
    }
    hits.sort(function (a, b) { return b[0] - a[0]; });
    countEl.textContent = '找到 ' + hits.length + ' 条结果' + (hits.length > limit ? '（显示前 ' + limit + ' 条）' : '');
    if (!hits.length) {
      results.innerHTML = '<li class="hint">没有匹配的结果。</li>';
      return;
    }
    var html = '';
    for (var j = 0; j < Math.min(hits.length, limit); j++) {
      var h = hits[j][1];
      var sn = snippetFor(h, needle);
      html += '<li><a href="' + esc(h[U]) + '">'
        + '<span class="kind">' + esc(h[K]) + '</span>'
        + '<span class="nm">' + esc(h[NZ] || h[NE]) + '</span>'
        + (h[NZ] && h[NE] ? '<em>' + esc(h[NE]) + '</em>' : '')
        + (sn ? '<div class="sn">' + esc(sn) + '</div>' : '')
        + '</a></li>';
    }
    results.innerHTML = html;
  }

  var url = JSON.parse(document.getElementById('search-index-url').textContent);
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      index = data;
      document.getElementById('count').textContent = '索引已就绪（' + index.length + ' 条）';
      render();
    })
    .catch(function () {
      results.innerHTML = '<li class="hint">搜索索引加载失败。</li>';
    });

  q.addEventListener('input', render);
  Array.prototype.forEach.call(radios, function (r) { r.addEventListener('change', render); });
  render();
})();
</script>
