name: 每周数据同步 + 部署 Wiki

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    # Quality gate: every push/PR must pass before anything is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 Python 依赖
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: 运行 Python 测试
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: assistant/package-lock.json

      - name: 安装 Node 依赖
        run: npm ci
        working-directory: assistant

      - name: Lint (eslint)
        run: npm run lint
        working-directory: assistant

      - name: 构建前端
        run: npm run build
        working-directory: assistant

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            assistant/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('assistant/src-tauri/Cargo.lock') }}

      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libgtk-3-dev

      - name: 创建 tauri build 所需的资源占位（图标不入库）
        run: |
          mkdir -p ../../data/icons
          # tauri-build 会校验 bundle resources 路径存在；图标库未提交，
          # CI 上放空目录占位，仅用于编译/测试，不需要真实内容
          touch ../../data/icons/.gitkeep
        working-directory: assistant/src-tauri

      - name: Lint (clippy)
        run: cargo clippy --lib -- -D warnings
        working-directory: assistant/src-tauri

      - name: 运行 Rust 测试
        run: cargo test --lib
        working-directory: assistant/src-tauri

  sync-and-deploy:
    needs: test        # 只有测试通过才同步/部署
    # 只在主干推送 / 定时 / 手动时部署；PR 仅跑 test job
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e .

      - name: 抓取数据 → 中文 SQLite
        run: |
          python -m crawler.cli --db data/dbd_cn.db
        env:
          DB_TZ: UTC

      - name: 抓取图标（仅补新增素材；失败不阻断部署）
        run: |
          python - <<'PY'
          import logging
          from crawler.icons import fetch_icons
          logging.basicConfig(level=logging.WARNING)
          try:
              print(fetch_icons(db_path="data/dbd_cn.db"))
          except Exception as exc:
              # GitHub 共享出口 IP 常被 wiki.gg 限流；历史图标已入库，
              # 仅新条目可能缺图，不应阻断同步与部署
              print("图标抓取跳过:", exc)
          PY

      - name: LLM 翻译长文本（未配置 LLM_API_KEY 时自动跳过）
        run: |
          python - <<'PY'
          from crawler.llm import API_KEY, translate_all_fields
          if not API_KEY:
              print("LLM_API_KEY 未配置，跳过翻译")
          else:
              print(translate_all_fields(db_path="data/dbd_cn.db"))
          PY
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.inferaiapi.com/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-v4-pro' }}

      - name: 生成静态 Wiki + sitemap + robots
        run: |
          python -m wiki.generate --db data/dbd_cn.db --out site --sitemap

      - name: 提交数据变更（只提交数据库；图标与站点不入库）
        run: |
          git config user.name "dbd-cn bot"
          git config user.email "dbd-cn@users.noreply.github.com"
          git add data/dbd_cn.db
          git diff --cached --quiet || git commit -m "chore: weekly sync $(date -u +%F)"
          git push

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false