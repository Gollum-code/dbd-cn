[package]
name = "dbd-assistant"
version = "0.1.0"
description = "DBD 助手 - 黎明杀机中文辅助工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dbd_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"